<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#f6f3ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16151a" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tasks">
<title>Task Tracker</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=8">
</head>
<body>

<!-- App -->
<div id="app" class="hidden">
  <div id="banner" class="banner hidden" role="alert"></div>

  <header class="topbar">
    <div>
      <div class="eyebrow"><span id="todayLabel"></span> <span id="modeLabel" class="mode-label"></span></div>
      <h1 class="serif title">My Tasks</h1>
    </div>
    <div class="top-actions">
      <button type="button" class="icon-btn admin-only" id="btnArrange" aria-label="Rearrange sections" title="Rearrange">⇅</button>
      <button type="button" class="icon-btn" id="btnMenu" aria-label="Settings" title="Settings">⚙︎</button>
    </div>
  </header>

  <div id="arrangeBar" class="arrange-bar hidden">
    <span>Use ↑ ↓ to move sections</span>
    <button type="button" class="btn small primary" id="btnArrangeDone">Done</button>
  </div>

  <main id="sections"></main>

  <button type="button" class="fab admin-only" id="fab" aria-label="Add">＋</button>
  <div id="fabMenu" class="fab-menu hidden">
    <button type="button" class="btn" id="fabTask">📝 New task</button>
    <button type="button" class="btn" id="fabPenalty">⚠️ Add penalty points</button>
  </div>
</div>

<!-- Bottom sheet -->
<div id="sheetWrap" class="sheet-wrap hidden">
  <div class="sheet-backdrop" data-close></div>
  <div class="sheet" role="dialog" aria-modal="true">
    <div class="sheet-grip"></div>
    <div id="sheetBody"></div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="app.js?v=8"></script>
</body>
</html>
